name: ci
on: pull_request
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      BATON_TOKEN: ${{ secrets.BATON_TOKEN }}
      BATON_ORGS: ConductorOne
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-github
        run: go build ./cmd/baton-github
      - name: Install baton CLI from baton-sdk (conductorone/baton is archived)
        run: |
          set -euxo pipefail
          BATON_VERSION=v0.11.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "${ARCH}" = "x86_64" ]; then ARCH="amd64"; fi
          FILENAME="baton-${BATON_VERSION}-${OS}-${ARCH}.tar.gz"
          curl -fsSL -O "https://github.com/conductorone/baton-sdk/releases/download/${BATON_VERSION}/${FILENAME}"
          tar xzf "${FILENAME}"
          mv baton /usr/local/bin/baton
          baton --version
      - name: Grant/revoke
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-github
          baton-entitlement: 'repository:642588514:admin'
          baton-principal: '166871869'
          baton-principal-type: 'user'
